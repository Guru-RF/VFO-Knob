name: Bug report
description: Something on the knob, or on its configuration page, does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. What to give, and why, is in the README's [Reporting a problem](https://github.com/Guru-RF/VFO-Knob#reporting-a-problem). The quickest way: **Report a problem** on the knob's configuration page opens this form with the firmware and the knob's report filled in.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I looked at the open issues, and this problem is not among them.
          required: true
  - type: input
    id: firmware
    attributes:
      label: The firmware and its version
      description: "As the address card says it: hold a finger on the S-meter until the knob clicks."
      placeholder: OpenX6X00 1.21.1
    validations:
      required: true
  - type: input
    id: radio
    attributes:
      label: The radio, receiver or reflector
      description: "Its model and its own software's version: an IC-705 and its firmware, a FLEX-6600 and SmartSDR's version, AetherSDR's version and the computer it runs on, an X6100 or X6200 and its OpenX6X00 version, a receiver's or a reflector's address."
      placeholder: "IC-705, firmware 1.33"
    validations:
      required: true
  - type: dropdown
    id: link
    attributes:
      label: How the knob reaches it
      options:
        - WiFi
        - The USB cable
        - SmartLink (FlexRadio)
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: "What you did, what you expected and what you got. What the face says -- NO LINK and the reason under it, a message in amber or red -- and the frequency, the mode and the screen you were on. A photo of the knob's face helps."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: The knob's report
      description: "**Report a problem** on the knob's configuration page fills this in: its firmware, how it last started, its power, network and link, a crash it remembers, and its recent log, with its passwords starred out. Make it right after the problem, before the knob restarts. Without the page, `nc <the knob's address> 3333` on a computer prints the log."
      render: text
  - type: textarea
    id: wifi
    attributes:
      label: WiFi
      description: "For a WiFi problem: the exact message on the face, the router's security (WPA2, WPA2/WPA3, WPA3 only), its 2.4 GHz channel, whether the network has more than one access point (a mesh, a repeater), and whether a phone's hotspot works."
  - type: textarea
    id: audio
    attributes:
      label: Audio and Bluetooth
      description: "For an audio problem: what you heard (the radio's audio, or your own transmission), the volume and the mic gain, and where: the jack, or a headset or speaker, by its make and model."
