<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608 608" width="608" height="608" role="img" aria-label="Tap the microphone: where to put the knob"><title>Tap the microphone: where to put the knob</title><defs><clipPath id="tg-05-glass"><circle cx="180" cy="180" r="180"/></clipPath><linearGradient id="tg-05-alu" x1="0.15" y1="0.05" x2="0.85" y2="0.95"><stop offset="0" stop-color="#4F8BF5"/><stop offset="0.45" stop-color="#2A5FDB"/><stop offset="1" stop-color="#16389A"/></linearGradient><linearGradient id="tg-05-chamfer" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#9CC0FF"/><stop offset="1" stop-color="#1B3F9E"/></linearGradient><linearGradient id="tg-05-gloss" x1="0" y1="0" x2="0.6" y2="0.7"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient><linearGradient id="tg-05-upd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#262015"/><stop offset="1" stop-color="#0C0E13"/></linearGradient><marker id="tg-05-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#E0902A"/></marker></defs><circle cx="303.8" cy="303.8" r="259.8" fill="url(#tg-05-alu)"/><circle cx="303.8" cy="303.8" r="258.8" fill="none" stroke="#0E2A74" stroke-width="2"/><circle cx="303.8" cy="303.8" r="219.0" fill="none" stroke="url(#tg-05-chamfer)" stroke-width="3" opacity="0.8"/><circle cx="303.8" cy="303.8" r="216.5" fill="#060709"/><g transform="translate(123.8,123.8)"><g clip-path="url(#tg-05-glass)"><rect x="0" y="0" width="360" height="360" fill="#08090C"/><text x="180.0" y="31.0" font-size="14" fill="#94A3B8" font-family="DejaVu Sans,Verdana,sans-serif" font-weight="400" text-anchor="middle">LISTENING</text><text x="180.0" y="73.0" font-size="14" fill="#94A3B8" font-family="DejaVu Sans,Verdana,sans-serif" font-weight="400" text-anchor="middle">5 / 5</text><text x="180.0" y="121.0" font-size="48" fill="#FFFFFF" font-family="DejaVu Sans,Verdana,sans-serif" font-weight="400" text-anchor="middle">-50</text><text x="180.0" y="141.0" font-size="14" fill="#94A3B8" font-family="DejaVu Sans,Verdana,sans-serif" font-weight="400" text-anchor="middle">dBFS in the tag's band</text><rect x="60" y="150" width="240" height="14" rx="3" fill="#1B1F29"/><rect x="60" y="150" width="150.0" height="14" rx="3" fill="#3FD26A"/><rect x="137.0" y="146" width="2" height="22" fill="#E2E8F0"/><rect x="266.0" y="146" width="2" height="22" fill="#E5A823"/><text x="180.0" y="189.0" font-size="14" fill="#E2E8F0" font-family="DejaVu Sans,Verdana,sans-serif" font-weight="400" text-anchor="middle">room -74, loudest -31 dBFS</text><text x="180.0" y="219.0" font-size="20" fill="#3FD26A" font-family="DejaVu Sans,Verdana,sans-serif" font-weight="400" text-anchor="middle">The tag is heard well</text><text x="180.0" y="247.0" font-size="14" fill="#3FD26A" font-family="DejaVu Sans,Verdana,sans-serif" font-weight="400" text-anchor="middle">tag heard: 0.083, 15.0 dB</text><text x="180.0" y="271.0" font-size="14" fill="#94A3B8" font-family="DejaVu Sans,Verdana,sans-serif" font-weight="400" text-anchor="middle">tried 31, read 14, CRC bad 17</text><text x="180.0" y="293.0" font-size="14" fill="#94A3B8" font-family="DejaVu Sans,Verdana,sans-serif" font-weight="400" text-anchor="middle">decoder 24%, lost 0</text></g></g><circle cx="303.8" cy="303.8" r="216.5" fill="url(#tg-05-gloss)"/><text x="303.8" y="593.7" font-size="16" fill="#E0902A" font-family="DejaVu Sans,Verdana,sans-serif" font-weight="700" text-anchor="middle">the tag's band against the room (white) and the loudest (gold)</text></svg>