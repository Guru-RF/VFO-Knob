<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 660" width="330" height="660" role="img" aria-label="The knob's WiFi page on a phone"><title>The knob's WiFi page on a phone</title><rect x="1" y="1" width="328" height="658" rx="42" fill="#1C1F26" stroke="#3A3F4B" stroke-width="2"/><rect x="14" y="14" width="302" height="632" rx="30" fill="#0b0f14"/><rect x="123" y="24" width="84" height="18" rx="9" fill="#1C1F26"/><g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif"><text x="30" y="78" font-size="22" fill="#e8eef5" font-weight="700" text-anchor="start">VFO-Knob</text><text x="30" y="104" font-size="13" fill="#8a99aa" font-weight="400" text-anchor="start">Choose the WiFi network the knob should</text><text x="30" y="122" font-size="13" fill="#8a99aa" font-weight="400" text-anchor="start">join. Once it is on it, the knob shows the</text><text x="30" y="140" font-size="13" fill="#8a99aa" font-weight="400" text-anchor="start">firmwares to choose from, on its own dial.</text><rect x="24" y="168" width="282" height="186" rx="14" fill="#141b24" stroke="#233040"/><rect x="36" y="182" width="258" height="40" rx="10" fill="#0f151d" stroke="#e5a823"/><text x="48" y="207" font-size="14" fill="#e8eef5" font-weight="400" text-anchor="start">HomeNetwork 🔒</text><text x="282" y="207" font-size="11" fill="#8a99aa" font-weight="400" text-anchor="end">●●●●</text><rect x="36" y="230" width="258" height="40" rx="10" fill="#0f151d" stroke="#233040"/><text x="48" y="255" font-size="14" fill="#e8eef5" font-weight="400" text-anchor="start">Upstairs 🔒</text><text x="282" y="255" font-size="11" fill="#8a99aa" font-weight="400" text-anchor="end">●●●</text><rect x="36" y="278" width="258" height="40" rx="10" fill="#0f151d" stroke="#233040"/><text x="48" y="303" font-size="14" fill="#e8eef5" font-weight="400" text-anchor="start">Neighbours 🔒</text><text x="282" y="303" font-size="11" fill="#8a99aa" font-weight="400" text-anchor="end">●●</text><text x="36" y="338" font-size="13" fill="#e5a823" font-weight="400" text-anchor="start">Look again</text><rect x="24" y="368" width="282" height="206" rx="14" fill="#141b24" stroke="#233040"/><text x="36" y="394" font-size="13" fill="#8a99aa" font-weight="400" text-anchor="start">Network</text><rect x="36" y="402" width="258" height="40" rx="10" fill="#0f151d" stroke="#233040"/><text x="48" y="427" font-size="14" fill="#e8eef5" font-weight="400" text-anchor="start">HomeNetwork</text><text x="36" y="462" font-size="13" fill="#8a99aa" font-weight="400" text-anchor="start">Password</text><rect x="36" y="470" width="258" height="40" rx="10" fill="#0f151d" stroke="#233040"/><text x="48" y="495" font-size="14" fill="#e8eef5" font-weight="400" text-anchor="start">••••••••••</text><text x="282" y="495" font-size="13" fill="#e5a823" font-weight="600" text-anchor="end">Show</text><rect x="36" y="520" width="258" height="42" rx="10" fill="#e5a823" fill-opacity="1"/><text x="165" y="547" font-size="15" fill="#111111" font-weight="600" text-anchor="middle">Connect</text></g></svg>